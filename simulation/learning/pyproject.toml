[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atom-learning"
version = "0.1.0"
description = "Goal-conditioned motion learning on the existing ATOM URDF prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "gymnasium==1.2.3"]

[project.optional-dependencies]
train = ["stable-baselines3==2.9.0", "torch>=2.8,<3"]
test = ["pytest>=8"]

[project.scripts]
atom-learn = "atom_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
